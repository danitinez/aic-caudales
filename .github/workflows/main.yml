name: Python Application

permissions:
  contents: write  # Explicitly set permission to write to the repository
  
# Fallback manual de emergencia. El camino primario de datos es la Raspberry
# Pi (deploy/README.md): systemd corre scripts/run_publish_on_pi.sh cada 4hs.
# Disparar este workflow solo si la Pi está caída.
on:
  workflow_dispatch:

env:
  LC_ALL: es_ES.UTF-8

jobs:
  modify-file:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Check out the repository
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # Specify the Python version

    # Step 3: Install any dependencies (if needed)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # If you have dependencies listed
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git fetch origin
        git checkout --track origin/caudales
    
    - name: es_ES.UTF-8
      run: |
        sudo locale-gen es_ES.UTF-8
        sudo update-locale LANG=es_ES.UTF-8
    
    - name: date
      run: date

    # Step 4: Run the Python script to modify a file
    - name: Run Python script
      run: python scraper_app.py  # Your Python script here

    # Keep the published historical ranges in sync with the fresh data.
    - name: Recompute min/max ranges
      run: python compute_ranges.py --write

    # Scrape reservoir (embalses) levels into docs/lakes.json. continue-on-error
    # keeps a lakes failure from blocking the caudales commit; the script itself
    # refuses to write a partial scrape, so old lakes.json survives on failure.
    - name: Run lakes scraper
      continue-on-error: true
      run: python lakes_scraper.py

    # Scrape the extended forecast (día/noche icon, temperature, wind) per
    # section's nearest city into docs/weather.json. Same continue-on-error
    # safety as the lakes scraper: a failure here never blocks the caudales
    # commit, and the script refuses to write a partial scrape.
    - name: Run weather scraper
      continue-on-error: true
      run: python weather_scraper.py

    - name: Update Front End
      # Copy ONLY the built app (html/assets), never *.json: the dist carries a
      # baked-in dev weather.json that would overwrite the data the scrapers
      # just published. --no-links is defense-in-depth in case a build output
      # symlink ever creeps back in (docs/*.json aliases are real-file copies,
      # never symlinks; see CLAUDE.md).
      run: rsync -a --no-links --exclude='*.json' front/dist/ docs/

    # - name: en_US.UTF-8
    #   env:
    #     LC_ALL: en_US.UTF-8
    #     LANG: en_US.UTF-8
    #   run: |
    #     sudo update-locale LANG=en_US.UTF-8
    #     date

    # Step 5: Configure Git user and commit changes
    - name: Commit and push changes
      run: |
        FILE_TO_CHECK="docs/"
        echo "---- Git status after running script"
        git status
        echo "---- Git DIFF"
        git diff
        echo "----"
        git diff-index --quiet HEAD && exit 0
        git add $FILE_TO_CHECK
        timestamp=$(date -u)
        git commit -m "Actualizando caudales: ${timestamp}"
        git push 
      env:
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token for authentication
